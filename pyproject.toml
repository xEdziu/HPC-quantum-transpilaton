[project]
name = "qmap"
version = "0.1.0"
description = "Qubit mapping optimisation with a distributed island GA (HPC project)"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.40",
    "networkx>=3.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pylatexenc>=2.11",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/qmap"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
